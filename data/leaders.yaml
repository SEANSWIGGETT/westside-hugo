- name: Faron Owen
  role: Pastor
  photo: leader-1.jpg
  bio:
    - "My name is Faron Owen and it will be my absolute privilege and joy to serve as your pastor. I am blessed to be married to Christa who is a saint who agreed to marry a pastor with five children. She is the Compliance Officer at Farmer’s National Bank in Danville. She is a UK Wildcat and has her Master of Education from the University of the Cumberlands. Collectively we have six children: Seth, Faron II, Faith, Declan, Sarah, and Morgan."
    - "It is my goal to always live my life in a way that makes it easy for others to believe in Jesus and to proclaim His good news in a way that shines light into darkness, hope into despair, and joy into heartache. Life these days can be tough and we all need the transforming power of the perfect love of the Father. I look forward to sharing that kind of love with each of you and then together sharing it with the world!"
