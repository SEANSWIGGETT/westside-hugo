- name: Faron Owen
  role: Pastor
  photo: leader-1.jpg
  bio:
    - "Faron Owen counts it an absolute privilege and joy to serve as pastor of Westside Community Church. Faron is blessed to be married to Christa, a saint who agreed to marry a pastor with five children. Christa is the Compliance Officer at Farmer’s National Bank in Danville, a UK Wildcat, and holds a Master of Education from the University of the Cumberlands. Together they have six children: Seth, Faron II, Faith, Declan, Sarah and Morgan."
    - "Faron’s goal is to live in a way that makes it easy for others to believe in Jesus, and to proclaim His good news in a way that shines light into darkness, hope into despair and joy into heartache. Life these days can be tough, and everyone needs the transforming power of the Father’s perfect love. Faron looks forward to sharing that kind of love with the people of Westside, and then, together, sharing it with the world."
