- name: Regina Carrier
  role: Administrative Assistant
  photo: leader-3.jpg
  bio:
    - "I have served as Administrative Assistant to the pastor since 2004. I teach the Preschool-Kindergarten Sunday School class. I retired in 2002 after teaching 31 years. Twenty-seven of those years were at Hustonville Elementary. I have two children, Nicole and Marshall, and four grandchildren, Karsyn, Cole, Grasyn, and Camden."
- name: Brenda Ellis
  role: Treasurer
  photo: leader-4.jpg
  bio:
    - "I served as treasurer at Moreland UMC and have continued in that position at Westside Community Church. Currently, I teach the Elementary Sunday School class. I retired in 2006 after teaching in the Danville Schools for 33 years. I have one son, Brad, and two grandsons, Hagen and Hunter."
- name: Debbie Gibson
  role: Children's Pastor
  photo: leader-5.jpg
  bio:
    - "My name is Debbie Gibson and I am the Children’s Pastor at Westside Community Church. I have a Bachelor Degree in Organizational Management and Leadership. I was a Nursing Home Administrator for years and have spent the last 20 years serving the geriatric population. I am married to Jim and we have four children and six grandchildren."
    - "In the past I have served in various positions, Children’s Director, Sunday School teacher, youth leader and VBS Director. I began my spiritual journey as a young child and gave my life to Christ as a teenager. I love serving God at Westside Community Church and teaching the next generation about Jesus. I'm always excited seeing what God has in store for the children’s ministry."
