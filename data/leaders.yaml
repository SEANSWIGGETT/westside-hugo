- name: Regina Carrier
  role: Administrative Assistant
  photo: leader-3.jpg
  bio:
    - "Regina Carrier has served as Administrative Assistant to the pastor since 2004 and teaches the Preschool–Kindergarten Sunday School class. Regina retired from teaching in 2002 after 31 years in the classroom, 27 of them at Hustonville Elementary. Regina has two children, Nicole and Marshall, and four grandchildren: Karsyn, Cole, Grasyn and Camden."
- name: Brenda Ellis
  role: Treasurer
  photo: leader-4.jpg
  bio:
    - "Brenda Ellis served as treasurer at Moreland UMC and has continued in that role at Westside Community Church, where Brenda also teaches the Elementary Sunday School class. A retired educator, Brenda taught in the Danville Schools for 33 years before retiring in 2006. Brenda has one son, Brad, and two grandsons, Hagen and Hunter."
- name: Debbie Gibson
  role: Children's Pastor
  photo: leader-5.jpg
  bio:
    - "Debbie Gibson is the Children’s Pastor at Westside Community Church. Debbie holds a bachelor’s degree in Organizational Management and Leadership, worked for years as a Nursing Home Administrator, and has spent the last 20 years serving the geriatric population. Debbie is married to Jim, and together they have four children and six grandchildren."
    - "Over the years Debbie has served as Children’s Director, Sunday School teacher, youth leader and VBS Director. Debbie’s spiritual journey began in early childhood and led to a commitment to Christ as a teenager. Debbie loves serving God at Westside Community Church and teaching the next generation about Jesus, and is always excited to see what God has in store for the children’s ministry."
